name: Build Android APK via Bubblewrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build TWA APK
        run: |
          npx @bubblewrap/cli init --manifest="https://ais-pre-p65lloufu6y2waeb65rk6l-690128072146.europe-west2.run.app/manifest.json"
          npx @bubblewrap/cli build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-HEMN-APK
          path: ./*.apk
